[package]
name = "agenttrace-collector"
description = "Local collector for AgentTrace: validates, redacts and stores spans in SQLite, and serves the query API + viewer."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "agenttrace-collector"
path = "src/main.rs"

[dependencies]
agenttrace = { path = "../agenttrace" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "limit"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
agenttrace = { path = "../agenttrace" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
