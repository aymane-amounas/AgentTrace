[workspace]
resolver = "2"
members = [
    "crates/agenttrace",
    "crates/agenttrace-collector",
    "crates/sample-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/aymane-amounas/agenttrace"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
